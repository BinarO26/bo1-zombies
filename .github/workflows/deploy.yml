name: Deploy Web Port
on:
  push:
    branches: [main]
permissions:
  contents: write
jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Emscripten (C++ to WebAssembly Compiler)
        uses: mymindstorm/setup-emsdk@v14

      - name: Compile Game Engine
        run: |
          mkdir build && cd build
          emcmake cmake ..
          emmake make

      - name: Deploy Compiled Files to GitHub Pages
        uses: JamesIves/github-pages-deploy-action@v4
        with:
          folder: build/dist  # Points to wherever the compiler drops the HTML/JS output
          branch: gh-pages
